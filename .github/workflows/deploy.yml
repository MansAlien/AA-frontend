name: Deploy website

# Every push to main is a new web build (1.0.4+NN), so it goes live right
# away: `git pull` in AA-frontend on the droplet, then `docker-compose
# restart` in AA-backend-prod, through the locked-down deploy key
# (AA-backend scripts/server/deploy.sh). Can also be re-run from the
# Actions tab.
on:
  push:
    branches: [main]
    paths: ["web/**"]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
    steps:
      - name: Set up the SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host key: the connection fails if the server's key changes.
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Pull the website on the server
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" frontend

      - name: Restart the backend
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" backend

      - name: Check the live version
        run: |
          # nginx is part of the restarted stack; give it a moment.
          curl -fsS --retry 10 --retry-delay 3 --retry-all-errors \
            "https://ammar-academy.com/version.json?ts=$(date +%s)"

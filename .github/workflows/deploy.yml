name: Deploy website

# Every push to main is a new web build (1.0.4+NN), so it goes live right
# away: `git pull` in AA-frontend on the droplet, through the locked-down
# deploy key (AA-backend scripts/server/deploy.sh). Can also be re-run from
# the Actions tab.
on:
  push:
    branches: [main]
    paths: ["web/**"]
  workflow_dispatch:

concurrency:
  group: production-frontend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Pull on the server over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host key: the connection fails if the server's key changes.
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" frontend

      - name: Check the live version
        run: |
          sleep 5
          curl -fsS "https://ammar-academy.com/version.json?ts=$(date +%s)"
